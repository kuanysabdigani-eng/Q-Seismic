<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Seismic Almaty — Система Раннего Предупреждения</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.5s ease;
        }
        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            background: rgba(30, 41, 59, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        h1 { 
            font-size: 26px; 
            margin-bottom: 5px; 
            color: #f1f5f9; 
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .subtitle { 
            font-size: 13px; 
            color: #94a3b8; 
            margin-bottom: 30px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-box {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            padding: 20px;
            border-radius: 12px;
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .timer {
            font-size: 52px;
            font-weight: bold;
            margin: 20px 0;
            display: none;
            color: #f87171;
            letter-spacing: -1px;
        }
        .timer span {
            display: block;
            font-size: 64px;
        }
        .details {
            font-size: 15px;
            color: #cbd5e1;
            margin-top: 25px;
            line-height: 1.6;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        /* Состояние тревоги */
        body.alarm-active {
            background-color: #7f1d1d !important;
        }
        body.alarm-active .container {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
        }
        body.alarm-active .status-box {
            background-color: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Q-SEISMIC ALMATY</h1>
        <div class="subtitle">Система многоуровневого сейсмомониторинга</div>

        <div class="status-box" id="statusBox">ВСЁ СПОКОЙНО</div>

        <div class="timer" id="timerContainer">
            УДАР ЧЕРЕЗ:
            <span id="countdown">--</span>
        </div>

        <div class="details" id="detailsText">
            Система активна. Идет непрерывное сканирование 3-х слоев защиты Тянь-Шаньского региона.
        </div>
    </div>

    <script>
        const ALMATY_LAT = 43.2389;
        const ALMATY_LON = 76.8897;

        // ЗАМЕНИ ЭТУ СТРОКУ на реальную ссылку твоего бэкенда с Render (когда он запустится)
        const BACKEND_URL = 'https://q-seismic.onrender.com/api/status';

        // Запрос разрешения на уведомления при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            console.log("Разрешение на уведомления получено.");
                        }
                    });
                }
            }
            // Сразу запускаем опрос сервера и повторяем каждые 10 секунд
            checkServerStatus();
            setInterval(checkServerStatus, 10000);
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Функция запуска тревоги для сайта и отправки уведомления
        function handleEarthquakeUI(distance, magnitude, layerName, isInstant = false) {
            document.body.classList.add('alarm-active');
            const statusBox = document.getElementById('statusBox');
            const timerContainer = document.getElementById('timerContainer');
            const detailsText = document.getElementById('detailsText');

            statusBox.innerText = `⚠️ ТРЕВОГА! ЗЕМЛЕТРЯСЕНИЕ!`;

            // Отправка браузерного системного уведомления
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("⚠️ Q-SEISMIC: ВНИМАНИЕ!", {
                    body: `Зафиксирован толчок! Зона: ${layerName}. Расстояние до Алматы: ${distance.toFixed(1)} км.`,
                    tag: "earthquake-alert",
                    requireInteraction: true
                });
            }

            if (isInstant) {
                timerContainer.style.display = 'block';
                document.getElementById('countdown').innerText = "МГНОВЕННО!";
                detailsText.innerHTML = `Эпицентр в критической зоне <b>(${distance.toFixed(1)} км)</b>.<br>Удар под боком, времени на предупреждение нет!`;
            } else {
                let seconds = Math.round(distance / 4);
                timerContainer.style.display = 'block';
                startCountdown(seconds);
                detailsText.innerHTML = `Зона: <b>${layerName}</b><br>Расстояние: ${distance.toFixed(1)} км | Магнитуда: ${magnitude}`;
            }
        }

        let countdownInterval;
        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            const countdownEl = document.getElementById('countdown');

            countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    countdownEl.innerText = timeLeft + " сек.";
                    timeLeft--;
                } else {
                    countdownEl.innerText = "УДАР!";
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        // Автоматический опрос твоего бэкенда на Render
        async function checkServerStatus() {
            try {
                const response = await fetch(BACKEND_URL);
                const data = await response.json();

                if (data.status === "ALARM") {
                    let isInstant = data.distance <= 30;
                    handleEarthquakeUI(data.distance, data.magnitude, data.zone, isInstant);
                }
            } catch (error) {
                console.log("Связь с сервером мониторинга устанавливается...");
            }
        }
    </script>
</body>
</html>
