<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Seismic Almaty — Система Раннего Предупреждения</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.5s ease;
        }
        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
            padding: 35px 25px;
            background: rgba(30, 41, 59, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 5px; 
            color: #f1f5f9; 
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .subtitle { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 25px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .status-box {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .timer {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
            display: none;
            color: #f87171;
            letter-spacing: -1px;
        }
        .timer span {
            display: block;
            font-size: 52px;
        }
        .details {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 20px;
            line-height: 1.5;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: left;
        }
        .feed-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .quake-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #38bdf8;
            font-size: 13px;
        }
        /* Состояние тревоги */
        body.alarm-active {
            background-color: #7f1d1d !important;
        }
        body.alarm-active .container {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
        }
        body.alarm-active .status-box {
            background-color: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Q-SEISMIC ALMATY</h1>
        <div class="subtitle">Система многоуровневого сейсмомониторинга</div>

        <div class="status-box" id="statusBox">ВСЁ СПОКОЙНО</div>

        <div class="timer" id="timerContainer">
            УДАР ЧЕРЕЗ:
            <span id="countdown">--</span>
        </div>

        <div class="details" id="detailsText">
            <div class="feed-title">📡 Мониторинг региона в реальном времени</div>
            <div id="quakeFeed">Подключение к сейсмосети USGS...</div>
        </div>
    </div>

    <script>
        const ALMATY_LAT = 43.2389;
        const ALMATY_LON = 76.8897;

        window.addEventListener('DOMContentLoaded', () => {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission().then(permission => {
                        if (permission === "granted") {
                            console.log("Разрешение на уведомления получено.");
                        }
                    });
                }
            }
            checkDirectAPI();
            setInterval(checkDirectAPI, 15000);
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function handleAlarmState(distance, magnitude, place, layerName, isInstant) {
            document.body.classList.add('alarm-active');
            const statusBox = document.getElementById('statusBox');
            const timerContainer = document.getElementById('timerContainer');
            
            statusBox.innerText = `⚠️ ТРЕВОГА! ЗЕМЛЕТРЯСЕНИЕ!`;

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("⚠️ Q-SEISMIC: ВНИМАНИЕ!", {
                    body: `Магнитуда: ${magnitude}. Место: ${place}. Расстояние: ${distance.toFixed(1)} км.`,
                    tag: "earthquake-alert",
                    requireInteraction: true
                });
            }

            if (isInstant) {
                timerContainer.style.display = 'block';
                document.getElementById('countdown').innerText = "МГНОВЕННО!";
                document.getElementById('detailsText').innerHTML = `<b>${layerName}</b><br>📍 Место: ${place}<br>⚡ Магнитуда: <b>${magnitude}</b><br>📏 Расстояние: <b>${distance.toFixed(1)} км</b><br><span style="color:#fca5a5;">Критическая зона, удар мгновенный!</span>`;
            } else {
                let seconds = Math.round(distance / 4);
                timerContainer.style.display = 'block';
                startCountdown(seconds);
                document.getElementById('detailsText').innerHTML = `<b>${layerName}</b><br>📍 Место: ${place}<br>⚡ Магнитуда: <b>${magnitude}</b><br>📏 Расстояние: <b>${distance.toFixed(1)} км</b>`;
            }
        }

        let countdownInterval;
        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            const countdownEl = document.getElementById('countdown');

            countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    countdownEl.innerText = timeLeft + " сек.";
                    timeLeft--;
                } else {
                    countdownEl.innerText = "УДАР!";
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        async function checkDirectAPI() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson');
                const data = await response.json();

                let feedHTML = `<div class="feed-title">📡 Мониторинг региона (Тянь-Шань)</div>`;
                let alarmTriggered = false;

                if (data && data.features && data.features.length > 0) {
                    let nearbyQuakes = 0;

                    for (const quake of data.features) {
                        const coords = quake.geometry.coordinates; 
                        const lon = coords[0];
                        const lat = coords[1];
                        const mag = quake.properties.mag;
                        const place = quake.properties.place || "Регион эпицентра";
                        const time = quake.properties.time;

                        const distance = calculateDistance(ALMATY_LAT, ALMATY_LON, lat, lon);

                        // Выводим в ленту все толчки в радиусе 1000 км за последний час
                        if (distance <= 1000) {
                            nearbyQuakes++;
                            feedHTML += `
                                <div class="quake-item">
                                    📍 <b>${place}</b><br>
                                    ⚡ Магнитуда: <b>${mag.toFixed(1)}</b> | 📏 Расстояние: <b>${distance.toFixed(1)} км</b>
                                </div>
                            `;

                            // Проверяем условия для включения сирены и тревоги
                            if (distance <= 300 && mag >= 3.5 && !alarmTriggered) {
                                alarmTriggered = true;
                                let zoneName = distance <= 30 ? "Слой 1: Критическая зона (Алматы)" : (distance <= 100 ? "Слой 2: Зона предупреждения" : "Слой 3: Зона мониторинга");
                                handleAlarmState(distance, mag, place, zoneName, distance <= 30);
                            }
                        }
                    }

                    if (nearbyQuakes === 0) {
                        feedHTML += `<div style="color: #94a3b8; text-align: center; padding: 10px; font-size: 13px;">За последний час толчков поблизости нет. Сеть активна.</div>`;
                    }
                } else {
                    feedHTML += `<div style="color: #94a3b8; text-align: center; padding: 10px; font-size: 13px;">Сканирование сети активто...</div>`;
                }

                // Обновляем ленту только если нет активной тревоги
                if (!document.body.classList.contains('alarm-active')) {
                    document.getElementById('detailsText').innerHTML = feedHTML;
                }

            } catch (error) {
                console.log("Ожидание данных сети...");
            }
        }
    </script>
</body>
</html>
