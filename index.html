<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-Seismic Almaty — Early Warning System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            transition: background-color 0.5s ease;
        }
        .container {
            text-align: center;
            max-width: 520px;
            width: 100%;
            padding: 35px 25px;
            background: rgba(30, 41, 59, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }
        h1 { 
            font-size: 24px; 
            margin-bottom: 5px; 
            color: #f1f5f9; 
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        .subtitle { 
            font-size: 12px; 
            color: #94a3b8; 
            margin-bottom: 15px; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        /* Live scanning indicator */
        .live-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 11px;
            color: #38bdf8;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 0 rgba(56, 189, 248, 0.4);
            animation: radar-pulse 1.5s infinite;
        }
        @keyframes radar-pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }
        .status-box {
            font-size: 24px;
            font-weight: bold;
            margin: 15px 0;
            padding: 15px;
            border-radius: 12px;
            background: #10b981;
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: background 0.3s, box-shadow 0.3s;
        }
        .timer {
            font-size: 42px;
            font-weight: bold;
            margin: 15px 0;
            display: none;
            color: #f87171;
            letter-spacing: -1px;
        }
        .timer span {
            display: block;
            font-size: 52px;
        }
        .details {
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 20px;
            line-height: 1.5;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.08);
            text-align: left;
            max-height: 260px;
            overflow-y: auto;
        }
        .feed-title {
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            text-align: center;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .last-checked {
            font-size: 11px;
            color: #64748b;
            text-align: center;
            margin-bottom: 10px;
        }
        .quake-item {
            background: rgba(15, 23, 42, 0.6);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #38bdf8;
            font-size: 13px;
        }
        .disclaimer {
            font-size: 10px;
            color: #64748b;
            margin-top: 15px;
            text-align: center;
            line-height: 1.3;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 10px;
        }
        /* Alarm state */
        body.alarm-active {
            background-color: #7f1d1d !important;
        }
        body.alarm-active .container {
            border-color: rgba(239, 68, 68, 0.4);
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.4);
        }
        body.alarm-active .status-box {
            background-color: #ef4444;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.6);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>Q-SEISMIC ALMATY</h1>
        <div class="subtitle">Multi-Layer Seismic Monitoring System</div>

        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>USGS Auto-Poll (Every 15s)</span>
        </div>

        <div class="status-box" id="statusBox">ALL CLEAR</div>

        <div class="timer" id="timerContainer">
            IMPACT IN:
            <span id="countdown">--</span>
        </div>

        <div class="details" id="detailsText">
            <div class="feed-title">📡 Scanning 3 Defense Layers</div>
            <div class="last-checked" id="lastCheckedTime">Status: connecting to servers...</div>
            <div id="quakeFeed">Initializing Tien Shan contours...</div>
        </div>

        <div class="disclaimer">
            Real-time data broadcast powered by the open USGS API. For informational purposes only.
        </div>
    </div>

    <script>
        const ALMATY_LAT = 43.2389;
        const ALMATY_LON = 76.8897;

        window.addEventListener('DOMContentLoaded', () => {
            if ("Notification" in window) {
                if (Notification.permission !== "granted" && Notification.permission !== "denied") {
                    Notification.requestPermission();
                }
            }
            checkDirectAPI();
            setInterval(checkDirectAPI, 15000);
        });

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function handleAlarmState(distance, magnitude, place, layerName, isInstant) {
            document.body.classList.add('alarm-active');
            const statusBox = document.getElementById('statusBox');
            const timerContainer = document.getElementById('timerContainer');

            statusBox.innerText = `⚠️ ALERT! EARTHQUAKE DETECTED!`;

            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("⚠️ Q-SEISMIC: WARNING!", {
                    body: `Magnitude: ${magnitude}. Zone: ${layerName}. Distance: ${distance.toFixed(1)} km.`,
                    tag: "earthquake-alert",
                    requireInteraction: true
                });
            }

            if (isInstant) {
                timerContainer.style.display = 'block';
                document.getElementById('countdown').innerText = "INSTANT!";
                document.getElementById('detailsText').innerHTML = `<b>${layerName}</b><br>📍 Location: ${place}<br>⚡ Magnitude: <b>${magnitude}</b><br>📏 Distance: <b>${distance.toFixed(1)} km</b>`;
            } else {
                let seconds = Math.round(distance / 4);
                timerContainer.style.display = 'block';
                startCountdown(seconds);
                document.getElementById('detailsText').innerHTML = `<b>${layerName}</b><br>📍 Location: ${place}<br>⚡ Magnitude: <b>${magnitude}</b><br>📏 Distance: <b>${distance.toFixed(1)} km</b>`;
            }
        }

        let countdownInterval;
        function startCountdown(seconds) {
            clearInterval(countdownInterval);
            let timeLeft = seconds;
            const countdownEl = document.getElementById('countdown');

            countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    countdownEl.innerText = timeLeft + " sec.";
                    timeLeft--;
                } else {
                    countdownEl.innerText = "IMPACT!";
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        async function checkDirectAPI() {
            try {
                const response = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson');
                const data = await response.json();

                const now = new Date();
                const timeString = now.toLocaleTimeString();
                let timeLogHtml = `<div class="last-checked">🔄 Last check: ${timeString} (USGS data live)</div>`;

                let feedHTML = `<div class="feed-title">📡 Tien Shan Contours (3 24h Layers)</div>` + timeLogHtml;
                let alarmTriggered = false;
                let foundEvents = 0;

                if (data && data.features) {
                    for (const quake of data.features) {
                        const coords = quake.geometry.coordinates; 
                        const lon = coords[0];
                        const lat = coords[1];
                        const mag = quake.properties.mag;
                        const place = quake.properties.place || "Epicenter region";

                        const distance = calculateDistance(ALMATY_LAT, ALMATY_LON, lat, lon);

                        if (distance <= 500) {
                            foundEvents++;
                            let layerBadge = "";
                            if (distance <= 30) layerBadge = "Layer 1 (Critical)";
                            else if (distance <= 100) layerBadge = "Layer 2 (Warning)";
                            else layerBadge = "Layer 3 (Monitoring)";

                            feedHTML += `
                                <div class="quake-item">
                                    🌐 <b>${layerBadge}</b><br>
                                    📍 ${place}<br>
                                    ⚡ Magnitude: <b>${mag.toFixed(1)}</b> | 📏 ${distance.toFixed(0)} km
                                </div>
                            `;
                            if (foundEvents >= 4) break; 
                        }

                        if (distance <= 300 && mag >= 3.5 && !alarmTriggered) {
                            alarmTriggered = true;
                            let zoneName = distance <= 30 ? "Layer 1: Critical Zone" : (distance <= 100 ? "Layer 2: Warning Zone" : "Layer 3: Monitoring Zone");
                            handleAlarmState(distance, mag, place, zoneName, distance <= 30);
                        }
                    }

                    if (foundEvents === 0) {
                        feedHTML += `<div style="color: #94a3b8; text-align: center; padding: 10px; font-size: 13px;">All 3 contours active. No seismic activity within 500 km.</div>`;
                    }
                }

                if (!document.body.classList.contains('alarm-active')) {
                    document.getElementById('detailsText').innerHTML = feedHTML;
                }

            } catch (error) {
                console.log("Waiting for network data...");
                document.getElementById('lastCheckedTime').innerText = "⚠️ USGS connection error, retrying...";
            }
        }
    </script>
</body>
</html>
